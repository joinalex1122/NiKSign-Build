name: Build NiKSign
on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: 'Bundle ID khi đóng gói'
        required: false
        default: 'com.niksign.app'
        type: string
  push:
    branches:
      - main
      - 'codex/niksign-*'
concurrency:
  group: niksign-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify source, dependencies and Patch v9 rules
        run: |
          python3 scripts/check-integration.py
          python3 scripts/check-dependencies.py
          python3 Tests/minizip_test.py
          python3 Tests/patch_v9_test.py
          python3 Tests/verify_ipa_test.py
          node Tests/web.test.js
          bash -n scripts/*.sh
  ios:
    needs: source-checks
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      NIKSIGN_BUNDLE_ID: ${{ inputs.bundle_id || 'com.niksign.app' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install build tools
        run: brew install xcodegen openssl@3 pkgconf
      - name: Two consecutive clean audits on one runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-results
          for audit_pass in 1 2; do
            bash scripts/audit-ios.sh "$audit_pass" 2>&1 | tee "audit-results/pass${audit_pass}.log"
            python3 scripts/check-build-log.py "audit-results/pass${audit_pass}.log"
          done
      - name: Package source archive
        run: |
          mkdir -p dist
          /usr/bin/zip -qry dist/NiKSign-3.3-source.zip Native Vendor Tests scripts web docs project.yml .github README.md LICENSE THIRD_PARTY_NOTICES.md VALIDATION.md FEATURES.md DEPENDENCIES.md upstream-lock.json dependencies-vendor-lock.json upstream-overlays.json server-overlays.json
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: NiKSign-unsigned-IPA-macos-15-intel
          path: |
            audit-results/pass1/NiKSign-unsigned.ipa
            audit-results/pass2/NiKSign-unsigned.ipa
            dist/NiKSign-3.3-source.zip
          if-no-files-found: error
      - name: Preserve audit diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: NiKSign-build-diagnostics-macos-15-intel
          path: |
            audit-results/*.log
            audit-results/**/binary-info.txt
            build/build.log
            NiKSign.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if-no-files-found: ignore
