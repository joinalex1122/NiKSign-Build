name: Build NiKSign
on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: 'Bundle ID khi đóng gói'
        required: false
        default: 'com.apple.mobile.MobileHouseArrest'
        type: string
  push:
    branches:
      - main
      - 'codex/niksign-*'
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source, dependencies and Patch v9 rules
        run: |
          python3 scripts/check-integration.py
          python3 scripts/check-dependencies.py
          python3 Tests/minizip_test.py
          python3 Tests/patch_v9_test.py
          python3 Tests/verify_ipa_test.py
          node Tests/web.test.js
          bash -n scripts/build-ios.sh
  ios:
    needs: source-checks
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      NIKSIGN_BUNDLE_ID: ${{ inputs.bundle_id || 'com.apple.mobile.MobileHouseArrest' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Check source integration
        run: python3 scripts/check-integration.py
      - name: Codec and Patch v9 regression tests
        run: |
          xcrun swiftc Vendor/3105/ThreeOneOSFive/helpers/PatchProjectModels.swift Vendor/3105/ThreeOneOSFive/helpers/PatchPackageCodec.swift Tests/CodecSmoke.swift -o /tmp/codec-test
          /tmp/codec-test
          xcrun swiftc -DNIKSIGN_STANDALONE_TEST Vendor/3105/ThreeOneOSFive/helpers/PatchProjectModels.swift Vendor/3105/ThreeOneOSFive/helpers/PatchPackageCodec.swift Vendor/3105/ThreeOneOSFive/helpers/PatchWorkspaceService.swift Native/Dependencies/NiKPatchV9Engine.swift Tests/PatchV9Smoke.swift -o /tmp/patch-v9-test
          /tmp/patch-v9-test
          xcrun swiftc -DNIKSIGN_STANDALONE_TEST Vendor/3105/ThreeOneOSFive/helpers/PatchProjectModels.swift Vendor/3105/ThreeOneOSFive/helpers/PatchPackageCodec.swift Vendor/3105/ThreeOneOSFive/helpers/PatchWorkspaceService.swift Native/Dependencies/NiKPatchV9Engine.swift Tests/PatchV9TransactionSmoke.swift -o /tmp/patch-v9-transaction-test
          /tmp/patch-v9-transaction-test
          xcrun swiftc Native/NiKFileImport.swift Native/Integration/SupportPolicy.swift Tests/FileImportSmoke.swift -o /tmp/file-import-test
          /tmp/file-import-test
      - name: File manager and certificate ZIP regression tests
        run: bash scripts/test-file-tools.sh
      - name: Build unsigned arm64 IPA
        run: bash scripts/build-ios.sh
      - name: Package source archive
        run: |
          mkdir -p dist
          /usr/bin/zip -qry dist/NiKSign-3.3-source.zip Native Vendor Tests scripts web docs project.yml .github README.md LICENSE THIRD_PARTY_NOTICES.md VALIDATION.md FEATURES.md DEPENDENCIES.md upstream-lock.json dependencies-vendor-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: NiKSign-unsigned-IPA-${{ matrix.runner }}
          path: |
            dist/NiKSign-unsigned.ipa
            dist/NiKSign-3.3-source.zip
            build/binary-info.txt
          if-no-files-found: error
      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NiKSign-build-diagnostics-${{ matrix.runner }}
          path: |
            build/build.log
            NiKSign.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if-no-files-found: ignore
