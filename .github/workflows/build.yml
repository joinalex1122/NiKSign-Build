name: Build NiKSign
on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: 'Bundle ID khi đóng gói'
        required: false
        default: 'com.apple.mobile.MobileHouseArrest'
        type: string
  push:
    branches:
      - main
      - 'codex/niksign-*'
concurrency:
  group: niksign-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify source, dependencies and Patch v9 rules
        run: |
          python3 scripts/check-integration.py
          python3 scripts/check-dependencies.py
          python3 Tests/minizip_test.py
          python3 Tests/patch_v9_test.py
          python3 Tests/verify_ipa_test.py
          node Tests/web.test.js
          bash -n scripts/*.sh
  ios:
    needs: source-checks
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      NIKSIGN_BUNDLE_ID: ${{ inputs.bundle_id || 'com.apple.mobile.MobileHouseArrest' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install build tools
        run: brew install xcodegen openssl@3 pkgconf
      - name: Build IPA
        shell: bash
        run: |
          set -euo pipefail
              bash scripts/build-ios.sh
              python3 scripts/check-build-log.py build/build.log
      - name: Package source archive
        run: |
          mkdir -p dist
          /usr/bin/zip -qry dist/NiKSign-3.3-source.zip Native Vendor Tests scripts web docs project.yml .github README.md LICENSE THIRD_PARTY_NOTICES.md VALIDATION.md FEATURES.md DEPENDENCIES.md upstream-lock.json dependencies-vendor-lock.json upstream-overlays.json server-overlays.json
      # Retry transient artifact service/DNS failures without rebuilding the app.
      - name: Upload IPA and source
        id: upload_ipa
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.2
        with: &ipa_artifact
          name: NiKSign-unsigned-IPA-macos-15-intel
          path: |
           dist/NiKSign-unsigned.ipa
            dist/NiKSign-3.3-source.zip
          if-no-files-found: error
          overwrite: true
      - name: Wait before retrying IPA upload
        if: ${{ !cancelled() && steps.upload_ipa.outcome == 'failure' }}
        run: sleep 15
      - name: Retry IPA upload
        id: upload_ipa_retry
        if: ${{ !cancelled() && steps.upload_ipa.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.2
        with: *ipa_artifact
      - name: Wait before final IPA upload
        if: ${{ !cancelled() && steps.upload_ipa_retry.outcome == 'failure' }}
        run: sleep 30
      - name: Final IPA upload attempt
        if: ${{ !cancelled() && steps.upload_ipa_retry.outcome == 'failure' }}
        uses: actions/upload-artifact@v7.0.2
        with: *ipa_artifact
      - name: Preserve audit diagnostics
        id: upload_diagnostics
        if: ${{ always() && !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.2
        with: &diagnostic_artifact
          name: NiKSign-build-diagnostics-macos-15-intel
          path: |
            build/binary-info.txt
            build/build.log
            NiKSign.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if-no-files-found: ignore
          overwrite: true
      - name: Wait before retrying diagnostic upload
        if: ${{ !cancelled() && steps.upload_diagnostics.outcome == 'failure' }}
        run: sleep 15
      - name: Retry diagnostic upload
        id: upload_diagnostics_retry
        if: ${{ !cancelled() && steps.upload_diagnostics.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.2
        with: *diagnostic_artifact
      - name: Wait before final diagnostic upload
        if: ${{ !cancelled() && steps.upload_diagnostics_retry.outcome == 'failure' }}
        run: sleep 30
      - name: Final diagnostic upload attempt
        if: ${{ !cancelled() && steps.upload_diagnostics_retry.outcome == 'failure' }}
        uses: actions/upload-artifact@v7.0.2
        with: *diagnostic_artifact
